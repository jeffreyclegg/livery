# ============================================================
# TOOLPATH · SHOP FLOOR — Hyprland
# Personal design system, Rev H. JDC.
#
# Active window: bearing bronze, the action color. Inactive: line strong.
# Solid, not the temper run: a border closes on itself, and temper is
# always linear. It never rings.
# ============================================================

$activeBorderColor = rgb(CE7A46)
$inactiveBorderColor = rgb(3D4450)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}
