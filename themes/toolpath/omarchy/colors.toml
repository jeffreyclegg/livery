# ============================================================
# TOOLPATH · SHOP FLOOR — Omarchy palette
# Personal design system, Rev H. JDC.
#
# Omarchy 3.x renders every themed config it is not handed from these keys
# (default/themed/*.tpl). The files beside this one override the templates
# where Toolpath needs more than one accent; the rest (foot, helix,
# obsidian, keyboard.rgb) come from here.
#
# Slots are the Ghostty theme's, slot for slot: normal = the Vellum value of
# each token, bright = the Shop Floor value. Green and bright cyan are the
# derived verdigris and lightened peacock, as there.
# ============================================================

