# ============================================================
# TOOLPATH · SHOP FLOOR — tmux
# Personal design system, Rev H. JDC.
#
# Styles only: source it from ~/.config/tmux/tmux.conf. It sets no keys and
# no options beyond color and status layout.
#
# Moved from the dotfiles tmux.conf, whose copper palette (#b87333 on
# #1c1a17) predated the spec. Same layout, spec values: bearing bronze is
# the action color, ink label every label, line strong the rules.
# ============================================================

# spec: ground / ink label
set -g status-style "bg=#14161B,fg=#9AA1AD"
set -g status-left  "#[fg=#CE7A46,bold] #S #[default]"
set -g status-left-length 20
# spec: ink annotation for the date, bearing bronze for the host
set -g status-right "#[fg=#7E8694]%a %d %b  %H:%M #[fg=#CE7A46]#h "
set -g status-right-length 60

set -g window-status-format         "#[fg=#7E8694] #I #W "
# spec: on-bronze on bearing bronze
set -g window-status-current-format "#[fg=#F7F2EA,bg=#CE7A46,bold] #I #W "
set -g window-status-activity-style "fg=#CE7A46"

# spec: line strong
set -g pane-border-style        "fg=#3D4450"
set -g pane-active-border-style "fg=#CE7A46"
# spec: inset / ink
set -g message-style "bg=#22262F,fg=#E8EAEE"
set -g mode-style    "bg=#CE7A46,fg=#F7F2EA"
