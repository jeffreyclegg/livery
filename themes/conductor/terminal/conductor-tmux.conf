# ============================================================
# CONDUCTOR · MOFFAT — tmux
# The build machine's theme, Rev H. JDC.
#
# Styles only. Append to ~/.config/tmux/tmux.conf; it sets no keys,
# no options beyond color and status layout.
#
# The status line reads like a departure board. The session name is the
# route, in sodium. Windows are the stops: the current one is a flap
# leaf (#E4E5E8 on the flap #0B0606, which never inverts), the rest are
# ink label on the ground. The clock is a sodium flap at the right end.
#
# The faintest ink tier (#7E8086) is not used anywhere here: every piece
# of the status line is a label.
# ============================================================

# --- Board ---
set -g status-style "bg=#130B0B,fg=#A4A6AB"
set -g status-justify left
set -g status-left-length 24
set -g status-right-length 60

# Route: session in sodium, then a line-strong rule.
set -g status-left "#[fg=#F2A33C,bold] #S #[fg=#4D3532,nobold]│ "

# Date is a measurement (hudson); host is a label (ink label); the time
# is the live figure, so it sits on a flap in sodium.
set -g status-right "#[fg=#A9B3C1]%a %d %b #[fg=#4D3532]│ #[fg=#A4A6AB]#h #[fg=#F2A33C,bg=#0B0606] %H:%M #[default]"

# --- Stops ---
set -g window-status-separator ""
set -g window-status-format         "#[fg=#A4A6AB] #I #W "
set -g window-status-current-format "#[fg=#E4E5E8,bg=#0B0606,bold] #I #W #[default]"
# Output in a background window is the train moving: sodium.
set -g window-status-activity-style "fg=#F2A33C,bg=#130B0B,nobold"
# A bell is a halt: warbonnet.
set -g window-status-bell-style     "fg=#E2503E,bg=#130B0B,bold"

# --- Panes ---
# Borders are structure. The active pane is the live one.
set -g pane-border-style        "fg=#352423"
set -g pane-active-border-style "fg=#F2A33C"
set -g display-panes-colour        "#A9B3C1"
set -g display-panes-active-colour "#F2A33C"

# --- Messages and prompts ---
# A notice posted on the board: ink on panel.
set -g message-style         "bg=#1B1212,fg=#DADBDE"
set -g message-command-style "bg=#1B1212,fg=#F2A33C"

# --- Copy mode and choosers ---
# Selection matches the Ghostty theme: ink on line strong.
set -g mode-style "bg=#4D3532,fg=#DADBDE"
setw -g copy-mode-match-style         "bg=#352423,fg=#DADBDE"
setw -g copy-mode-current-match-style "bg=#F2A33C,fg=#130B0B"

# --- Clock (prefix t) ---
setw -g clock-mode-colour "#F2A33C"
setw -g clock-mode-style 24
